name: Package apps

# Builds the downloadable apps: a Windows installer and Mac/Linux archives, each with its own
# Node and the right native binaries. Runs on pull requests that touch packaging (so it is
# proven before merge) and on version tags, which also publish a GitHub Release.
on:
  pull_request:
    paths:
      - 'packaging/**'
      - 'deploy/kiosk/**'
      - '.github/workflows/package.yml'
  push:
    tags: ['v*']
  # Actions tab, Package apps, Run workflow: fill in a version (for example 0.2.0) to publish a release.
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to publish, like 0.2.0 (leave empty to only build)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  bundle:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest }
          - { name: macos-arm64, os: macos-latest }
          - { name: linux-x64, os: ubuntu-latest }
    env:
      MANTEL_GOOGLE_CLIENT_ID: ${{ secrets.MANTEL_GOOGLE_CLIENT_ID }}
      MANTEL_GOOGLE_CLIENT_SECRET: ${{ secrets.MANTEL_GOOGLE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Version
        id: v
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; elif [[ -n "${{ inputs.version }}" ]]; then v="${{ inputs.version }}"; v="${v#v}"; else v="$(node -p "require('./apps/server/package.json').version")-${GITHUB_SHA::7}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Assemble the bundle
        run: node packaging/build-bundle.mjs dist/bundle "${{ steps.v.outputs.version }}"

      - name: Check the PowerShell scripts parse
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem packaging\windows\*.ps1, deploy\kiosk\surface\*.ps1 | ForEach-Object {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref] $null, [ref] $errs) | Out-Null
            if ($errs) { $bad++; $errs | ForEach-Object { Write-Host "$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)" } }
          }
          if ($bad) { throw "$bad script(s) have syntax errors" }

      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          $ver = '${{ steps.v.outputs.version }}' -replace '-.*$', ''
          & $iscc "/DMyVersion=$ver" "/DBundleDir=$PWD\dist\bundle" "/DOutDir=$PWD\dist" packaging\windows\Mantel.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed' }
          Rename-Item "dist\Mantel-$ver-windows-setup.exe" "Mantel-${{ steps.v.outputs.version }}-windows-setup.exe" -ErrorAction SilentlyContinue

      - name: Mac and Linux archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name="mantel-${{ steps.v.outputs.version }}-${{ matrix.name }}"
          mkdir -p "dist/$name"
          cp -R dist/bundle/. "dist/$name/"
          cp packaging/portable/start.sh packaging/portable/start.command packaging/portable/README.txt "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"

      - name: Smoke test the bundle
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name="mantel-${{ steps.v.outputs.version }}-${{ matrix.name }}"
          cd "dist/$name"
          DATA_DIR="$RUNNER_TEMP/mantel-data" PORT=8791 ./start.sh > "$RUNNER_TEMP/mantel.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8791/api/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8791/api/health
          curl -sf -X POST "http://127.0.0.1:8791/api/pair/local?name=ci" | grep deviceKey
          curl -sf http://127.0.0.1:8791/ | grep -qi "<html"
      - name: Smoke test the bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:DATA_DIR = "$env:RUNNER_TEMP\mantel-data"; $env:PORT = '8791'; $env:LOCAL_PAIR = '1'
          $env:DISPLAY_DIST = "$PWD\dist\bundle\app\display"; $env:NODE_ENV = 'production'
          $p = Start-Process "$PWD\dist\bundle\node.exe" -ArgumentList "$PWD\dist\bundle\app\dist\index.js" -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\out.log" -RedirectStandardError "$env:RUNNER_TEMP\err.log"
          $ok = $false
          for ($i = 0; $i -lt 30 -and -not $ok; $i++) { try { Invoke-RestMethod http://127.0.0.1:8791/api/health | Out-Null; $ok = $true } catch { Start-Sleep 1 } }
          if (-not $ok) { Get-Content "$env:RUNNER_TEMP\err.log", "$env:RUNNER_TEMP\out.log"; throw 'server did not start' }
          $r = Invoke-RestMethod -Method Post "http://127.0.0.1:8791/api/pair/local?name=ci"
          if (-not $r.deviceKey) { throw 'local pairing failed' }
          $st = powershell -NoProfile -ExecutionPolicy Bypass -File packaging\windows\tray.ps1 -Status -Port 8791 | ConvertFrom-Json
          if (-not $st.running -or $st.port -ne 8791) { throw "tray status wrong: $($st | ConvertTo-Json)" }
          Stop-Process $p -Force

      - uses: actions/upload-artifact@v4
        with:
          name: mantel-${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*-setup.exe
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tag="$GITHUB_REF_NAME"; else v="${{ inputs.version }}"; tag="v${v#v}"; fi
          # A release made by hand on GitHub already exists; add the files to it. Otherwise create it
          # (which also creates the tag at this commit).
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" assets/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" assets/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Mantel ${tag#v}" --generate-notes
          fi
