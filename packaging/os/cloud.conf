#cloud-config
# Runs once on a Mantel OS box's first boot (shipped in our gadget as cloud.conf).
# Test-grade images only: the local mantel snap has no store id, so the gadget cannot list
# its interface connections; this makes them instead. Stage 4 moves them into gadget.yaml.
datasource_list: [None]
write_files:
  - path: /run/mantel-diag.sh
    permissions: '0755'
    content: |
      #!/bin/sh
      # Prints the kiosk's state on the serial console, for the VM test.
      out() { sed 's/^/mantel-diag: /' > /dev/ttyS0; }
      snap wait system seed.loaded
      snap connect wpe-webkit-mir-kiosk:wayland ubuntu-frame:wayland 2>&1 | out
      snap restart wpe-webkit-mir-kiosk 2>&1 | out
      sleep 60
      {
        echo "== connections"; snap connections wpe-webkit-mir-kiosk
        echo "== frame connections"; snap connections ubuntu-frame
        echo "== services"; snap services
        echo "== kiosk config"; snap get -d wpe-webkit-mir-kiosk
        echo "== kiosk logs"; snap logs -n 60 wpe-webkit-mir-kiosk
        echo "== frame logs"; snap logs -n 40 ubuntu-frame
        echo "== mantel connections"; snap connections mantel
        echo "== snaps"; snap list
      } 2>&1 | out
runcmd:
  - [sh, -c, 'echo "mantel: first-boot config ran" > /dev/ttyS0']
  - [systemd-run, --unit=mantel-diag, --no-block, /run/mantel-diag.sh]
  - [snap, wait, system, seed.loaded]
  - [snap, set, mantel, box=true]
  - [sh, -c, 'snap connect mantel:network-manager network-manager:service || true']
  - [sh, -c, 'snap connect mantel:display-control || true']
  - [snap, restart, mantel]
