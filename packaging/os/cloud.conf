#cloud-config
# Runs once on a Mantel OS box's first boot (shipped in our gadget as cloud.conf).
# Test-grade images only: the local mantel snap has no store id, so the gadget cannot list
# its interface connections; this makes them instead. Stage 4 moves them into gadget.yaml.
datasource_list: [None]
runcmd:
  - [sh, -c, 'echo "mantel: first-boot config ran" > /dev/console']
